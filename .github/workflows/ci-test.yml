# ci-test — this file is yours.
#
# gt created it once and will never modify or delete it again.
#
# The coverage profile is uploaded as `gt-coverage`, which the bulwark stage
# consumes instead of running the suite a second time.
name: ci-test

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.5"
          cache: true

      - name: go test
        run: go test -race -coverprofile=coverage.out ./...

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gt-coverage
          path: coverage.out
          if-no-files-found: error
