# Managed by gt — edit .gt-repo.yaml, then run `gt repo sync`.
#
# Shared policy (cooldown, commit-message prefix, schedule) lives in gt's
# template, not here, so changing it for every repo is a one-line edit in gt.
#
# The 7-day cooldown is the supply-chain guard: by the time a PR exists,
# the upstream release has been in the wild long enough to surface yanks and
# compromised publishers before an auto-merge-eligible PR lands on the default
# branch.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Dependabot's commit message is also its PR title, and PRs are
    # squash-merged, so the prefix is what keeps dependency updates inside
    # Conventional Commits. `include: scope` appends the dependency scope,
    # producing e.g. `ci(deps): bump …`.
    commit-message:
      prefix: "ci"
      include: scope
    cooldown:
      default-days: 7
    open-pull-requests-limit: 25

  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    # Dependabot's commit message is also its PR title, and PRs are
    # squash-merged, so the prefix is what keeps dependency updates inside
    # Conventional Commits. `include: scope` appends the dependency scope,
    # producing e.g. `build(deps): bump …`.
    commit-message:
      prefix: "build"
      include: scope
    cooldown:
      default-days: 7
    open-pull-requests-limit: 25

  # The dashboard bundle at internal/dashboard/assets/index.html is vendored,
  # and ci.yml rebuilds it and fails if the committed copy differs. Dependabot
  # bumps web/package.json but cannot regenerate the bundle, so any bump that
  # changes the build output lands as a red PR that auto-merge will not touch.
  #
  # Fix on such a PR with:
  #   yarn --cwd web build && cp web/dist/index.html internal/dashboard/assets/index.html
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    # Dependabot's commit message is also its PR title, and PRs are
    # squash-merged, so the prefix is what keeps dependency updates inside
    # Conventional Commits. `include: scope` appends the dependency scope,
    # producing e.g. `build(deps): bump …`.
    commit-message:
      prefix: "build"
      include: scope
    cooldown:
      default-days: 7
    open-pull-requests-limit: 25
