# Repository governance for gt. This file is the source of truth; run
# 'gt repo sync' to render it, and 'gt repo check' to verify.
#
# Shared policy (Dependabot cooldown, commit-message prefixes, the weekly sync
# schedule) lives in gt's templates, not here, so it stays consistent across
# every governed repo.
#
# checks.required lists the checks gt's gate waits on. Do not list the gate
# itself — it is the aggregator, and branch protection requires only it.

gt_version: v0.7.0
dependabot:
  - ecosystem: github-actions
    directory: /
  - ecosystem: gomod
    directory: /
  - ecosystem: npm
    directory: /web
checks:
  timeout_minutes: 30
  required:
    - build, vet & test
    - dashboard bundle up to date
  optional: []
dependabot_auto_merge:
  enabled: true
  schedule: 0 1 * * *
  max_bump: minor
  delete_branch: true
conventional_commits:
  enabled: true
  scope: pr_title
  types:
    - feat
    - fix
    - chore
    - ci
    - docs
    - refactor
    - test
settings:
  merge:
    squash: true
    merge_commit: false
    rebase: false
    delete_branch_on_merge: true
  branch_protection:
    branch: main
    required_approvals: 0
    require_up_to_date: true
files:
  - gate
  - sync
  - dependabot-auto-merge
