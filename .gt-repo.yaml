# Repository governance for gt. This file is the source of truth; run
# 'gt repo sync' to render it, and 'gt repo check' to verify.
#
# Shared policy (Dependabot cooldown, commit-message prefixes, the weekly sync
# schedule) lives in gt's templates, not here, so it stays consistent across
# every governed repo.
#
# The pipeline stages below become jobs in ci-orchestration.yml, each calling a
# ci-*/cd-* workflow that belongs to this repository: gt creates those once and
# never touches them again. Branch protection needs exactly one check, ci-gate,
# which waits on all of them.

gt_version: v1.0.0
dependabot:
  - ecosystem: github-actions
    directory: /
  - ecosystem: gomod
    directory: /
  - ecosystem: npm
    directory: /web
    note: |
      The dashboard bundle at internal/dashboard/assets/index.html is vendored,
      and ci.yml rebuilds it and fails if the committed copy differs. Dependabot
      bumps web/package.json but cannot regenerate the bundle, so any bump that
      changes the build output lands as a red PR that auto-merge will not touch.

      Fix on such a PR with:
        yarn --cwd web build && cp web/dist/index.html internal/dashboard/assets/index.html
dependabot_auto_merge:
  enabled: true
  schedule: 0 1 * * *
  max_bump: minor
  delete_branch: true
bulwark:
  # On. This repository has no security scanning today, so gt's stage is an
  # addition rather than a duplicate — unlike wardnet, where a second bulwark
  # run would fight the existing coverage plumbing.
  #
  # Expect findings on the first run. Nothing gates on them: ci-gate is not the
  # required check yet, so a red bulwark here is information about the
  # repository, discovered while it is still free to be wrong.
  enabled: true
pipeline:
  ci:
    enabled: true
    stages:
      - preflight
      - build
      - test
    merge_queue: false
  # Off: cd-orchestration fires on v*.*.*, which release.yml already owns, and
  # its verify-attestation runs with require: true — no tree carries an
  # attestation yet, so the next release would go red on a pipeline that ships
  # nothing. Turn on in the PR that moves release.yml into the cd-* stages.
  cd:
    enabled: false
    stages:
      - preflight
      - publish
      - deploy
      - verify
    tags:
      - v*.*.*
conventional_commits:
  enabled: true
  scope: pr_title
  types:
    - feat
    - fix
    - docs
    - style
    - refactor
    - perf
    - test
    - build
    - ci
    - chore
    - revert
settings:
  merge:
    squash: true
    merge_commit: false
    rebase: false
    delete_branch_on_merge: true
  branch_protection:
    branch: main
    required_approvals: 0
    require_up_to_date: false
files:
  - sync
  - dependabot-auto-merge
