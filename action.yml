name: cubit
description: >
  Run benchmarks through cubit — compare a PR against the recorded baseline and
  post a non-blocking summary comment, or record a new baseline on the default
  branch. Never fails the build; the comment + dashboard inform a human.

inputs:
  version:
    description: cubit version to install (omit or "latest" for the latest release)
    default: latest
  criterion-dir:
    description: criterion output directory to ingest (relative to the repo root)
    default: target/criterion
  bench-command:
    description: >
      optional shell command that produces the criterion output (e.g.
      "cargo bench --bench dns_components"). Omit if an earlier step already ran
      the benchmarks.
    default: ""
  state-branch:
    description: orphan branch cubit stores baselines on
    default: cubit-state
  threshold:
    description: flag benchmarks slower than baseline by more than this percent
    default: "15"
  dashboard-url:
    description: trend-dashboard URL to link from the PR comment
    default: ""
  pages-branch:
    description: >
      optional branch to publish each PR's dashboard to (e.g. "gh-pages"),
      under cubit/pr-<number>/index.html. When set (and the push succeeds),
      the PR comment links the hosted dashboard instead of the artifact
      download. Requires GitHub Pages to serve from that branch; fork PRs
      fall back to the artifact link because their token cannot push.
      With pages-repo, selects the branch of the host repo to publish to
      (defaults to the host repo's default branch).
    default: ""
  pages-repo:
    description: >
      optional owner/repo of a separate repository that hosts the dashboards
      (a central Pages hub, e.g. "wardnet/perf-reports"). Dashboards land
      under <source-repo>/pr-<number>/index.html there, so one hub can serve
      many repos. Requires pages-token, because the workflow's own
      github.token cannot push to another repository.
    default: ""
  pages-token:
    description: >
      token with contents write access to pages-repo (a fine-grained PAT or
      GitHub App token), usually passed from a secret. Secrets are absent on
      fork PRs, which then fall back to the artifact link. Do NOT expose this
      via pull_request_target workflows.
    default: ""
  pages-url:
    description: >
      base URL the published dashboards are served from. Defaults to
      https://<owner>.github.io/<repo> of the repo they are pushed to —
      override for custom domains or user/organization sites.
    default: ""
  mode:
    description: >
      "auto" (default) compares on pull_request and records on a push to the
      default branch. Force with "compare" or "record".
    default: auto
  paired:
    description: >
      "true" runs a paired same-runner comparison on pull_request: bench-command
      runs on BOTH the PR head and the base commit on the same runner, and the
      two are compared directly — cancelling machine-to-machine variance that a
      stored baseline can't. Requires `bench-command` and the caller's checkout
      to use `fetch-depth: 0` (so the base commit is available). Ignored for
      record runs.
    default: "false"
  github-token:
    description: token used to post the PR comment and push the state branch
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Install cubit
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        # install.sh is fetched from the latest release; CUBIT_VERSION pins the
        # binary it installs and install.sh verifies its SHA-256 before use.
        if [[ "${VERSION}" != "latest" ]]; then
          export CUBIT_VERSION="${VERSION}"
        fi
        export CUBIT_INSTALL_DIR="${RUNNER_TEMP}/cubit-bin"
        curl -fsSL -o "${RUNNER_TEMP}/cubit-install.sh" https://github.com/wardnet/cubit/releases/latest/download/install.sh
        sh "${RUNNER_TEMP}/cubit-install.sh"
        echo "${CUBIT_INSTALL_DIR}" >> "$GITHUB_PATH"

    - name: Run benchmarks
      if: inputs.bench-command != ''
      shell: bash
      env:
        BENCH_COMMAND: ${{ inputs.bench-command }}
      run: |
        eval "$BENCH_COMMAND"

    - name: Fetch state branch
      shell: bash
      env:
        STATE: ${{ inputs.state-branch }}
      run: |
        # Best-effort: the branch may not exist yet (first ever run). A present
        # remote-tracking ref is what cubit reads baselines from, and what a
        # record run bases its append on.
        git fetch origin "+refs/heads/${STATE}:refs/remotes/origin/${STATE}" 2>/dev/null || true

    - name: cubit
      id: cubit
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        DIR: ${{ inputs.criterion-dir }}
        STATE: ${{ inputs.state-branch }}
        THRESHOLD: ${{ inputs.threshold }}
        DASH: ${{ inputs.dashboard-url }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        EVENT: ${{ github.event_name }}
        PR_BASE: ${{ github.event.pull_request.base.ref }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        PAIRED: ${{ inputs.paired }}
        BENCH_COMMAND: ${{ inputs.bench-command }}
      run: |
        set -euo pipefail
        report="${RUNNER_TEMP}/cubit-report.md"
        dashboard="${RUNNER_TEMP}/cubit-dashboard.html"
        echo "report=${report}" >> "$GITHUB_OUTPUT"
        echo "dashboard=${dashboard}" >> "$GITHUB_OUTPUT"

        # Resolve auto mode from the triggering event.
        mode="$MODE"
        if [[ "$mode" == "auto" ]]; then
          if [[ "$EVENT" == "pull_request" ]]; then
            mode="compare"
          elif [[ "$GITHUB_REF_NAME" == "$DEFAULT_BRANCH" ]]; then
            mode="record"
          else
            echo "cubit: nothing to do (push to non-default branch $GITHUB_REF_NAME)"
            echo "did-run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
        fi
        echo "did-run=true" >> "$GITHUB_OUTPUT"
        echo "mode=${mode}" >> "$GITHUB_OUTPUT"

        dash_arg=()
        [[ -n "$DASH" ]] && dash_arg=(--dashboard-url "$DASH")

        fallback_report() {
          printf '## <img src="https://raw.githubusercontent.com/wardnet/cubit/main/assets/cubit-logo.png" alt="" width="16" align="top"> cubit — performance\n\n⚠️ cubit could not produce a report — no benchmark output was found at `%s` (did the benchmark step run?).\n' "$DIR" > "$report"
        }

        if [[ "$mode" == "compare" ]]; then
          # This is a light gate: a compare error must NOT fail the consuming
          # workflow. `if ! ...` is exempt from `set -e`, so we fall back to a
          # short note and keep the job green.
          if [[ "$PAIRED" == "true" && -n "${PR_BASE_SHA:-}" && -n "${BENCH_COMMAND:-}" ]]; then
            # Paired same-runner comparison. The "Run benchmarks" step already
            # produced the PR head's criterion in $DIR; snapshot it, then bench the
            # BASE commit on this same runner and compare the two directly —
            # cancelling machine-to-machine variance a stored baseline can't.
            pr_crit="${RUNNER_TEMP}/cubit-crit-pr"
            base_crit="${RUNNER_TEMP}/cubit-crit-base"
            rm -rf "$pr_crit" "$base_crit"
            cp -r "$DIR" "$pr_crit" 2>/dev/null || mkdir -p "$pr_crit"

            orig=$(git rev-parse HEAD)
            git fetch --no-tags origin "$PR_BASE_SHA" 2>/dev/null || true
            if git checkout -q --detach "$PR_BASE_SHA" 2>/dev/null; then
              rm -rf "$DIR"
              eval "$BENCH_COMMAND" || true
              cp -r "$DIR" "$base_crit" 2>/dev/null || mkdir -p "$base_crit"
              git checkout -q --detach "$orig"
            else
              echo "cubit: could not check out base ${PR_BASE_SHA} — set the caller's checkout to fetch-depth: 0. Comparing against an empty baseline." >&2
              mkdir -p "$base_crit"
            fi

            if ! cubit compare --repo . --criterion-dir "$pr_crit" \
              --baseline-criterion-dir "$base_crit" \
              --commit "$PR_HEAD_SHA" --branch "$PR_HEAD_REF" \
              --threshold "$THRESHOLD" "${dash_arg[@]}" \
              --out "$report"; then
              fallback_report
            fi
          else
            # Single run vs the stored cubit-state baseline. latest:<base> yields
            # an empty baseline (all "new") the first time, which is fine.
            if ! cubit compare --repo . --criterion-dir "$DIR" \
              --baseline-ref "latest:${PR_BASE}" \
              --commit "$PR_HEAD_SHA" --branch "$PR_HEAD_REF" \
              --threshold "$THRESHOLD" "${dash_arg[@]}" \
              --out "$report"; then
              fallback_report
            fi
          fi
          # Render the standalone trend dashboard for the run artifact
          # (best-effort — a missing state branch just yields an empty page).
          cubit serve --repo . --state-branch "$STATE" --branch "$PR_BASE" \
            --out "$dashboard" || true
        else
          # record: base the local state branch on origin's tip (if any) so the
          # append's compare-and-swap lands on top of existing history.
          if git rev-parse --verify --quiet "refs/remotes/origin/${STATE}" >/dev/null; then
            git branch -f "$STATE" "refs/remotes/origin/${STATE}"
          fi
          git config user.name "cubit"
          git config user.email "cubit@users.noreply.github.com"
          # Recording the baseline is best-effort: a failure to record or push
          # (e.g. the state branch diverged, or a concurrent update won the CAS)
          # must not fail the workflow — it just means the next PR compares
          # against a slightly older baseline. Surface it on stderr instead.
          if cubit record --persist --repo . --criterion-dir "$DIR" \
            --commit "$GITHUB_SHA" --branch "$DEFAULT_BRANCH" --state-branch "$STATE"; then
            git push origin "$STATE" \
              || echo "cubit: push of ${STATE} failed (diverged or concurrent update?) — baseline not updated" >&2
          else
            echo "cubit: recording the baseline failed — baseline not updated" >&2
          fi
        fi

    - name: Publish dashboard to Pages
      id: pages
      if: github.event_name == 'pull_request' && steps.cubit.outputs.mode == 'compare' && (inputs.pages-branch != '' || inputs.pages-repo != '')
      shell: bash
      env:
        PAGES: ${{ inputs.pages-branch }}
        PAGES_REPO: ${{ inputs.pages-repo }}
        PAGES_TOKEN: ${{ inputs.pages-token }}
        PAGES_URL: ${{ inputs.pages-url }}
        DASHBOARD: ${{ steps.cubit.outputs.dashboard }}
        PR: ${{ github.event.pull_request.number }}
        OWNER: ${{ github.repository_owner }}
        REPO: ${{ github.event.repository.name }}
      run: |
        set -euo pipefail
        # Best-effort: publishing is a convenience link, never a gate. Fork PRs
        # (no secrets / read-only token) and races with concurrent pushes fall
        # through to the artifact link appended in the next steps.
        if [[ ! -f "$DASHBOARD" ]]; then
          echo "cubit: no dashboard to publish" >&2
          exit 0
        fi

        # <owner>.github.io repos serve from the root domain; everything else
        # is a project site under /<repo>/.
        pages_base() { # $1 = owner, $2 = repo
          local owner_lc="${1,,}" repo_lc="${2,,}"
          if [[ "$repo_lc" == "${owner_lc}.github.io" ]]; then
            printf 'https://%s' "$repo_lc"
          else
            printf 'https://%s.github.io/%s' "$owner_lc" "$2"
          fi
        }

        if [[ -n "$PAGES_REPO" ]]; then
          # Publish to a separate host repo (central Pages hub). The workflow's
          # own github.token cannot push across repos, so this needs pages-token.
          if [[ -z "$PAGES_TOKEN" ]]; then
            echo "cubit: pages-repo is set but pages-token is empty (fork PR, or the secret was not passed) — the comment will link the artifact instead" >&2
            exit 0
          fi
          remote="https://x-access-token:${PAGES_TOKEN}@github.com/${PAGES_REPO}.git"
          clone="${RUNNER_TEMP}/cubit-pages"
          rm -rf "$clone"
          cloned=true
          if [[ -n "$PAGES" ]]; then
            if ! git clone -q --depth 1 --branch "$PAGES" "$remote" "$clone" 2>/dev/null; then
              # The branch may not exist in the hub yet — start it empty.
              if git clone -q --depth 1 "$remote" "$clone" 2>/dev/null; then
                git -C "$clone" checkout -q --orphan "$PAGES"
                git -C "$clone" rm -rfq . 2>/dev/null || true
              else
                cloned=false
              fi
            fi
          else
            git clone -q --depth 1 "$remote" "$clone" 2>/dev/null \
              && PAGES=$(git -C "$clone" rev-parse --abbrev-ref HEAD) \
              || cloned=false
          fi
          if [[ "$cloned" != true ]]; then
            echo "cubit: could not clone ${PAGES_REPO} — check that pages-token has contents write access to it" >&2
            exit 0
          fi
          mkdir -p "${clone}/${REPO}/pr-${PR}"
          cp "$DASHBOARD" "${clone}/${REPO}/pr-${PR}/index.html"
          git -C "$clone" config user.name "cubit"
          git -C "$clone" config user.email "cubit@users.noreply.github.com"
          git -C "$clone" add -A
          git -C "$clone" diff --cached --quiet \
            || git -C "$clone" commit -qm "cubit: ${REPO} dashboard for PR #${PR}"
          # A shared hub makes concurrent publishes (other PRs, other repos)
          # likely, so replay our commit on the moved tip and retry.
          pushed=false
          for _ in 1 2 3; do
            if git -C "$clone" push -q origin "HEAD:refs/heads/${PAGES}" 2>/dev/null; then
              pushed=true
              break
            fi
            git -C "$clone" fetch -q origin "refs/heads/${PAGES}" 2>/dev/null || true
            git -C "$clone" rebase -q FETCH_HEAD 2>/dev/null || true
          done
          rm -rf "$clone"
          if [[ "$pushed" == true ]]; then
            base="${PAGES_URL:-$(pages_base "${PAGES_REPO%%/*}" "${PAGES_REPO#*/}")}"
            echo "url=${base%/}/${REPO}/pr-${PR}/" >> "$GITHUB_OUTPUT"
          else
            echo "cubit: could not push to ${PAGES_REPO} — the comment will link the artifact instead" >&2
          fi
          exit 0
        fi

        wt="${RUNNER_TEMP}/cubit-pages"
        rm -rf "$wt"
        git fetch origin "+refs/heads/${PAGES}:refs/remotes/origin/${PAGES}" 2>/dev/null || true
        if git rev-parse --verify --quiet "refs/remotes/origin/${PAGES}" >/dev/null; then
          git worktree add --detach "$wt" "refs/remotes/origin/${PAGES}"
        else
          git worktree add --detach "$wt"
          git -C "$wt" checkout -q --orphan "$PAGES"
          git -C "$wt" rm -rfq . 2>/dev/null || true
        fi
        mkdir -p "$wt/cubit/pr-${PR}"
        cp "$DASHBOARD" "$wt/cubit/pr-${PR}/index.html"
        git -C "$wt" config user.name "cubit"
        git -C "$wt" config user.email "cubit@users.noreply.github.com"
        git -C "$wt" add -A
        git -C "$wt" diff --cached --quiet || git -C "$wt" commit -qm "cubit: dashboard for PR #${PR}"
        if git -C "$wt" push origin "HEAD:refs/heads/${PAGES}"; then
          base="${PAGES_URL:-$(pages_base "$OWNER" "$REPO")}"
          echo "url=${base%/}/cubit/pr-${PR}/" >> "$GITHUB_OUTPUT"
        else
          echo "cubit: could not push ${PAGES} (fork PR or read-only token?) — the comment will link the artifact instead" >&2
        fi
        git worktree remove --force "$wt" 2>/dev/null || true

    - name: Upload report artifact
      id: artifact
      if: always() && steps.cubit.outputs.mode == 'compare'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: cubit-report-${{ github.job }}
        path: |
          ${{ steps.cubit.outputs.report }}
          ${{ steps.cubit.outputs.dashboard }}
        if-no-files-found: ignore
        retention-days: 14

    - name: Link dashboard and write job summary
      if: always() && steps.cubit.outputs.mode == 'compare'
      shell: bash
      env:
        REPORT: ${{ steps.cubit.outputs.report }}
        DASHBOARD: ${{ steps.cubit.outputs.dashboard }}
        PAGES_LINK: ${{ steps.pages.outputs.url }}
        ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
      run: |
        set -euo pipefail
        [[ -f "$REPORT" ]] || exit 0
        # Give the comment a one-click path to the dashboard: the hosted Pages
        # copy when published, otherwise a direct artifact download (GitHub
        # serves artifacts only as zips, so that link is download-and-open).
        if [[ -n "${PAGES_LINK:-}" ]]; then
          printf '\n📊 [View this run'\''s dashboard](%s)\n' "$PAGES_LINK" >> "$REPORT"
        elif [[ -n "${ARTIFACT_URL:-}" && -f "$DASHBOARD" ]]; then
          printf '\n📊 [Download this run'\''s dashboard](%s) (zip — open `cubit-dashboard.html`)\n' "$ARTIFACT_URL" >> "$REPORT"
        fi
        # Mirror the report on the run page so it is one click from the PR's
        # checks, with no artifact download at all.
        cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"

    - name: Post PR comment
      if: github.event_name == 'pull_request' && steps.cubit.outputs.mode == 'compare'
      uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
      with:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        header: cubit
        path: ${{ steps.cubit.outputs.report }}
